  <!-- ============ BOTTOM LEGEND ============ -->
  <text x="700" y="1145" text-anchor="middle" font-size="14" font-weight="700" fill="#64748b" letter-spacing="3">SIX GEMMA 4 CAPABILITIES, ONE MODEL</text>

  <g transform="translate(155, 1170)" font-size="14" font-weight="600">
    <g>
      <rect x="0" y="0" width="180" height="36" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
