  <!-- N: Voice Input (INPUT, coral) -->
  <g filter="url(#nodeShadow)">
    <rect x="600" y="160" width="200" height="130" rx="14" fill="#ffffff" stroke="#fb7185" stroke-width="1.5"/>
    <circle cx="635" cy="190" r="18" fill="#fff1f2"/>
    <text x="635" y="197" text-anchor="middle" font-size="20">🎙️</text>
    <text x="665" y="195" font-size="16" font-weight="700" fill="#0f172a">Voice Input</text>
    <text x="615" y="225" font-size="14" font-weight="700" fill="#9f1239" letter-spacing="1.2">INPUT</text>
    <line x1="615" y1="234" x2="785" y2="234" stroke="#fecdd3" stroke-width="0.8"/>
    <text x="615" y="252" font-size="15" fill="#475569">16 kHz mono · Silero VAD</text>
    <text x="615" y="269" font-size="15" fill="#475569">Hindi · Tamil · Bengali · 140+</text>
  </g>

  <!-- NE: Damage Photo (INPUT, coral) -->
  <g filter="url(#nodeShadow)">
    <rect x="868" y="256" width="200" height="130" rx="14" fill="#ffffff" stroke="#fb7185" stroke-width="1.5"/>
    <circle cx="903" cy="286" r="18" fill="#fff1f2"/>
    <text x="903" y="293" text-anchor="middle" font-size="20">📷</text>
    <text x="933" y="291" font-size="16" font-weight="700" fill="#0f172a">Damage Photo</text>
    <text x="883" y="321" font-size="14" font-weight="700" fill="#9f1239" letter-spacing="1.2">INPUT</text>
    <line x1="883" y1="330" x2="1053" y2="330" stroke="#fecdd3" stroke-width="0.8"/>
    <text x="883" y="348" font-size="15" fill="#475569">JPEG → 384px encoded</text>
    <text x="883" y="365" font-size="15" fill="#475569">HAZUS 0-4 damage grading</text>
  </g>

  <!-- E: Emergency Alert (INPUT, coral) -->
  <g filter="url(#nodeShadow)">
    <rect x="980" y="555" width="200" height="130" rx="14" fill="#ffffff" stroke="#fb7185" stroke-width="1.5"/>
    <circle cx="1015" cy="585" r="18" fill="#fff1f2"/>
    <text x="1015" y="592" text-anchor="middle" font-size="20">🚨</text>
    <text x="1045" y="590" font-size="16" font-weight="700" fill="#0f172a">Emergency Alert</text>
    <text x="995" y="620" font-size="14" font-weight="700" fill="#9f1239" letter-spacing="1.2">INPUT</text>
    <line x1="995" y1="629" x2="1165" y2="629" stroke="#fecdd3" stroke-width="0.8"/>
    <text x="995" y="647" font-size="15" fill="#475569">Cell Broadcast · WEA · SMS</text>
    <text x="995" y="664" font-size="15" fill="#475569">government-issued, any lang</text>
  </g>

  <!-- SE: Piper TTS (OUTPUT, teal) -->
  <g filter="url(#nodeShadow)">
    <rect x="868" y="854" width="200" height="130" rx="14" fill="#ffffff" stroke="#14b8a6" stroke-width="1.5"/>
    <circle cx="903" cy="884" r="18" fill="#f0fdfa"/>
    <text x="903" y="891" text-anchor="middle" font-size="20">🔊</text>
    <text x="933" y="889" font-size="16" font-weight="700" fill="#0f172a">Piper TTS</text>
    <text x="883" y="919" font-size="14" font-weight="700" fill="#0f766e" letter-spacing="1.2">OUTPUT</text>
    <line x1="883" y1="928" x2="1053" y2="928" stroke="#ccfbf1" stroke-width="0.8"/>
    <text x="883" y="946" font-size="15" fill="#475569">12+ neural voices</text>
    <text x="883" y="963" font-size="15" fill="#475569">sherpa_onnx · ~50 MB each</text>
  </g>

  <!-- S: Triage Report (OUTPUT, teal) -->
  <g filter="url(#nodeShadow)">
    <rect x="600" y="954" width="200" height="130" rx="14" fill="#ffffff" stroke="#14b8a6" stroke-width="1.5"/>
    <circle cx="635" cy="984" r="18" fill="#f0fdfa"/>
    <text x="635" y="991" text-anchor="middle" font-size="20">📋</text>
    <text x="665" y="989" font-size="16" font-weight="700" fill="#0f172a">ICS-209 Report</text>
    <text x="615" y="1019" font-size="14" font-weight="700" fill="#0f766e" letter-spacing="1.2">OUTPUT</text>
    <line x1="615" y1="1028" x2="785" y2="1028" stroke="#ccfbf1" stroke-width="0.8"/>
    <text x="615" y="1046" font-size="15" fill="#475569">render_triage_report tool</text>
    <text x="615" y="1063" font-size="15" fill="#475569">FEMA structured JSON</text>
  </g>

  <!-- SW: Inline Map (OUTPUT, teal) -->
  <g filter="url(#nodeShadow)">
    <rect x="332" y="854" width="200" height="130" rx="14" fill="#ffffff" stroke="#14b8a6" stroke-width="1.5"/>
    <circle cx="367" cy="884" r="18" fill="#f0fdfa"/>
    <text x="367" y="891" text-anchor="middle" font-size="20">🗺️</text>
    <text x="397" y="889" font-size="16" font-weight="700" fill="#0f172a">Inline Map</text>
    <text x="347" y="919" font-size="14" font-weight="700" fill="#0f766e" letter-spacing="1.2">OUTPUT</text>
    <line x1="347" y1="928" x2="517" y2="928" stroke="#ccfbf1" stroke-width="0.8"/>
    <text x="347" y="946" font-size="15" fill="#475569">render_map_view tool</text>
    <text x="347" y="963" font-size="15" fill="#475569">CARTO tiles · OSM POIs</text>
  </g>

  <!-- W: Skills Registry (CAPABILITY, amber) -->
  <g filter="url(#nodeShadow)">
    <rect x="220" y="555" width="200" height="130" rx="14" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="255" cy="585" r="18" fill="#fffbeb"/>
    <text x="255" y="592" text-anchor="middle" font-size="20">📜</text>
    <text x="285" y="590" font-size="16" font-weight="700" fill="#0f172a">Skills Registry</text>
    <text x="235" y="620" font-size="14" font-weight="700" fill="#92400e" letter-spacing="1.2">CAPABILITY</text>
    <line x1="235" y1="629" x2="405" y2="629" stroke="#fef3c7" stroke-width="0.8"/>
    <text x="235" y="647" font-size="15" fill="#475569">6 markdown SKILL.md files</text>
    <text x="235" y="664" font-size="15" fill="#475569">drop-in, no recompile</text>
  </g>

  <!-- NW: Native Kotlin (OS LAYER, slate) -->
  <g filter="url(#nodeShadow)">
    <rect x="332" y="256" width="200" height="130" rx="14" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    <circle cx="367" cy="286" r="18" fill="#f1f5f9"/>
    <text x="367" y="293" text-anchor="middle" font-size="20">⚙️</text>
    <text x="397" y="291" font-size="16" font-weight="700" fill="#0f172a">Native Kotlin</text>
    <text x="347" y="321" font-size="14" font-weight="700" fill="#1e293b" letter-spacing="1.2">OS LAYER</text>
    <line x1="347" y1="330" x2="517" y2="330" stroke="#e2e8f0" stroke-width="0.8"/>
    <text x="347" y="348" font-size="15" fill="#475569">SMS receiver · siren · wake-app</text>
    <text x="347" y="365" font-size="15" fill="#475569">full-screen takeover</text>
