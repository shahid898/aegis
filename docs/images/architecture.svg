  <!-- ============ FOOTER ============ -->
  <text x="700" y="1245" text-anchor="middle" font-size="15" fill="#94a3b8" font-style="italic">
    140+ languages · 6 skills · 2 tools · 100% offline after onboarding · Apache 2.0
