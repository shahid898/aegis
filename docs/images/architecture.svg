<svg width="1400" height="1280" viewBox="0 0 1400 1280" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'SF Pro Display', system-ui, sans-serif">

  <!-- ============ DEFS ============ -->
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="46%" r="65%">
      <stop offset="0%" stop-color="#fafbff"/>
      <stop offset="70%" stop-color="#eef0f7"/>
      <stop offset="100%" stop-color="#e0e3ec"/>
    </radialGradient>

    <radialGradient id="brainGrad" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </radialGradient>

    <radialGradient id="haloGrad" cx="50%" cy="50%" r="50%">
      <stop offset="55%" stop-color="rgba(124,58,237,0.0)"/>
      <stop offset="85%" stop-color="rgba(124,58,237,0.10)"/>
      <stop offset="100%" stop-color="rgba(124,58,237,0.0)"/>
    </radialGradient>

    <filter id="nodeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="brainShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ============ BACKGROUND ============ -->
  <rect width="1400" height="1280" fill="url(#bgGrad)"/>

  <!-- Subtle "no signal" markers in corners -->
  <g opacity="0.32" font-size="15">
    <text x="50" y="40" fill="#94a3b8">⊘ no signal</text>
    <text x="1350" y="40" fill="#94a3b8" text-anchor="end">⊘ no signal</text>
    <text x="50" y="1260" fill="#94a3b8">⊘ no signal</text>
    <text x="1350" y="1260" fill="#94a3b8" text-anchor="end">⊘ no signal</text>
  </g>

  <!-- ============ TITLE ============ -->
  <text x="700" y="62" text-anchor="middle" font-size="38" font-weight="700" fill="#0f172a" letter-spacing="-0.5">One Brain. Many Radii.</text>
  <text x="700" y="96" text-anchor="middle" font-size="16" fill="#64748b">Aegis collapses voice, vision, text, and tool-calling into a single offline Gemma 4 model</text>

  <!-- ============ OUTER PERIMETER ============ -->
  <circle cx="700" cy="620" r="495" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 5" opacity="0.55"/>

  <defs>
    <path id="perimeterTop" d="M 280 620 A 420 420 0 0 1 1120 620" fill="none"/>
    <path id="perimeterBottom" d="M 1120 620 A 420 420 0 0 1 280 620" fill="none"/>
  </defs>
  <text font-size="14" font-weight="600" fill="#64748b" letter-spacing="3">
    <textPath href="#perimeterTop" startOffset="50%" text-anchor="middle">⊘ AIRPLANE MODE · ZERO NETWORK · 3.5 GB ON-DEVICE ⊘</textPath>
  </text>
  <text font-size="15" font-weight="500" fill="#94a3b8" letter-spacing="2">
    <textPath href="#perimeterBottom" startOffset="50%" text-anchor="middle">the only network call lives in onboarding</textPath>
  </text>

  <!-- ============ BRAIN HALO ============ -->
  <circle cx="700" cy="620" r="230" fill="url(#haloGrad)"/>
  <circle cx="700" cy="620" r="170" fill="none" stroke="rgba(124,58,237,0.20)" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- ============ SPOKES (drawn before nodes so they sit underneath) ============ -->

  <!-- All spokes are simple straight lines from node-edge toward brain-edge -->
  <!-- INPUT spokes: coral -->
  <line x1="700" y1="290" x2="700" y2="480" stroke="#fb7185" stroke-width="2.5" stroke-linecap="round" opacity="0.65"/>
  <line x1="918" y1="370" x2="804" y2="490" stroke="#fb7185" stroke-width="2.5" stroke-linecap="round" opacity="0.65"/>
  <line x1="1010" y1="620" x2="840" y2="620" stroke="#fb7185" stroke-width="2.5" stroke-linecap="round" opacity="0.65"/>

  <!-- OUTPUT spokes: teal -->
  <line x1="918" y1="870" x2="804" y2="750" stroke="#14b8a6" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="700" y1="950" x2="700" y2="760" stroke="#14b8a6" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="482" y1="870" x2="596" y2="750" stroke="#14b8a6" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>

  <!-- INFRASTRUCTURE spokes -->
  <line x1="390" y1="620" x2="560" y2="620" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="482" y1="370" x2="596" y2="490" stroke="#475569" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>

  <!-- ============ SPOKE LABELS (horizontal, on midpoints) ============ -->
  <!-- N spoke: midpoint (700, 385) -->
  <g transform="translate(700, 385)">
    <rect x="-55" y="-12" width="110" height="22" rx="11" fill="#fff1f2" stroke="#fb7185" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" font-size="15" font-weight="600" fill="#9f1239">audio → ASR</text>
  </g>

  <!-- NE spoke: midpoint (861, 430) -->
  <g transform="translate(861, 430)">
    <rect x="-58" y="-12" width="116" height="22" rx="11" fill="#fff1f2" stroke="#fb7185" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" font-size="15" font-weight="600" fill="#9f1239">image → vision</text>
  </g>

  <!-- E spoke: midpoint (925, 620) -->
  <g transform="translate(925, 620)">
    <rect x="-55" y="-12" width="110" height="22" rx="11" fill="#fff1f2" stroke="#fb7185" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" font-size="15" font-weight="600" fill="#9f1239">text → classify</text>
  </g>

  <!-- SE spoke: midpoint (861, 810) -->
  <g transform="translate(861, 810)">
    <rect x="-58" y="-12" width="116" height="22" rx="11" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" font-size="15" font-weight="600" fill="#0f766e">text → speech</text>
  </g>

  <!-- S spoke: midpoint (700, 855) — wider label for "function call · required" -->
  <g transform="translate(700, 855)">
    <rect x="-95" y="-13" width="190" height="24" rx="12" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" font-size="15" font-weight="600" fill="#0f766e">function call · required</text>
  </g>

  <!-- SW spoke: midpoint (539, 810) -->
  <g transform="translate(539, 810)">
    <rect x="-78" y="-12" width="156" height="22" rx="11" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" font-size="15" font-weight="600" fill="#0f766e">function call · auto</text>
  </g>

  <!-- W spoke: midpoint (475, 620) -->
  <g transform="translate(475, 620)">
    <rect x="-65" y="-12" width="130" height="22" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">→ system prompt</text>
  </g>

  <!-- NW spoke: midpoint (539, 430) -->
  <g transform="translate(539, 430)">
    <rect x="-58" y="-12" width="116" height="22" rx="11" fill="#f1f5f9" stroke="#475569" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">MethodChannel</text>
  </g>

  <!-- ============ BRAIN ============ -->
  <circle cx="700" cy="620" r="140" fill="url(#brainGrad)" filter="url(#brainShadow)"/>
  <circle cx="660" cy="580" r="50" fill="rgba(255,255,255,0.18)" filter="blur(20px)"/>

  <text x="700" y="572" text-anchor="middle" font-size="15" font-weight="700" fill="rgba(255,255,255,0.7)" letter-spacing="4">— ONE BRAIN —</text>
  <text x="700" y="610" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff" letter-spacing="-0.5">Gemma 4 E2B IT</text>
  <text x="700" y="636" text-anchor="middle" font-size="15" font-weight="500" fill="rgba(255,255,255,0.92)">flutter_gemma → LiteRT-LM</text>
  <text x="700" y="654" text-anchor="middle" font-size="14" fill="rgba(255,255,255,0.78)">.litertlm · 3.4 GB · 2B params</text>

  <line x1="615" y1="676" x2="785" y2="676" stroke="rgba(255,255,255,0.25)" stroke-width="0.8"/>
  <text x="700" y="697" text-anchor="middle" font-size="15" fill="rgba(255,255,255,0.85)">cold 13s · warm 2s · 4 engines, 1 model</text>

