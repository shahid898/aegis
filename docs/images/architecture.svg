    </g>
    <g transform="translate(195, 0)">
      <rect x="0" y="0" width="140" height="36" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
      <text x="70" y="22" text-anchor="middle" fill="#5b21b6">👁 Vision</text>
    </g>
    <g transform="translate(350, 0)">
      <rect x="0" y="0" width="140" height="36" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
      <text x="70" y="22" text-anchor="middle" fill="#5b21b6">🎙 Audio ASR</text>
    </g>
    <g transform="translate(505, 0)">
      <rect x="0" y="0" width="200" height="36" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
      <text x="100" y="22" text-anchor="middle" fill="#5b21b6">🛠 Native Function Call</text>
    </g>
    <g transform="translate(720, 0)">
      <rect x="0" y="0" width="195" height="36" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
      <text x="97" y="22" text-anchor="middle" fill="#5b21b6">🎯 Tool-Choice Modes</text>
    </g>
    <g transform="translate(930, 0)">
      <rect x="0" y="0" width="160" height="36" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
      <text x="80" y="22" text-anchor="middle" fill="#5b21b6">📚 128K Context</text>
    </g>
