name: aegis
description: "Aegis - Offline AI emergency assistant"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5
  flutter: ^3.41.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.1
  bloc: ^9.2.0

  # Modeling
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  equatable: ^2.0.8

  # DI
  get_it: ^9.2.1

  # Routing
  go_router: ^17.2.2

  # Local storage (Hive Community Edition)
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4

  # Device / platform
  permission_handler: ^12.0.1
  geolocator: ^14.0.2
  path_provider: ^2.1.5

  # Map (region picker)
  flutter_map: ^8.3.0
  latlong2: ^0.9.1

  # i18n
  intl: ^0.20.2

  # Offline voice (STT/TTS)
  sherpa_onnx: ^1.12.39

  # Audio playback (language samples, TTS output)
  just_audio: ^0.10.5

  # Networking (one-time model-pack download)
  dio: ^5.9.2

  # Archive extraction (.tar.bz2 from sherpa-onnx releases)
  archive: ^4.0.9

  # Hashing (SHA256 verification of model packs)
  crypto: ^3.0.7

  # Microphone capture (Phase 3 assistant loop)
  flutter_sound: ^9.30.0

  # On-device LLM runtime (Phase 3 assistant brain).
  # 0.14.0 replaces the buggy Kotlin LiteRtLm AAR on Android with a Dart
  # FFI path (same as desktop/iOS). 0.13.x's Kotlin
  # `Conversation$JniMessageCallbackImpl` was the source of the
  # `MarkPendingInputTokenAsProcessed` and `AddPendingInputToken called
  # with an existing pending token` errors that surfaced whenever we
  # closed and recreated sessions to swap audio modality on/off between
  # transcription and chat turns.
  flutter_gemma: ^0.14.0

  # Telephony + clipboard for emergency SOS fallback
  url_launcher: ^6.3.2

  # Photo capture for triage intake. We use `image_picker` rather than
  # the lower-level `camera` plugin because all we need is a one-shot
  # capture-and-return — no live preview UI. Pulls in the system
  # camera/gallery picker on both Android and iOS.
  image_picker: ^1.1.2

  # Image scaling — JPEG 512px longest edge before sending to Gemma 4
  # so the prompt's image-token budget stays predictable.
  image: ^4.3.0

  # YAML frontmatter parser for the Agent Skills registry. Each
  # SKILL.md has frontmatter `name:` + `description:` that gets
  # concatenated into Gemma 4's system prompt at chat-session
  # creation, so capabilities are discoverable without a code change.
  yaml: ^3.1.2

  # Flutter Labs' generative-UI framework (BSD-3) — implements the
  # A2UI v0.9 protocol (https://a2ui.org). We use:
  #   * SurfaceController + Catalog + CatalogItem for the dynamic
  #     widget registry (basic catalog + 9 Aegis-specific cards).
  #   * A2uiTransportAdapter to parse Gemma 4's streaming token
  #     output into A2UI messages on the fly.
  #   * Surface widget to render the live tree the model is composing.
  # Pulls audioplayers + video_player; that's fine — we will reuse
  # them for survivor-statement playback in a later sprint.
  genui: ^0.9.0

  # Schema builder used by genui's CatalogItem to declare the
  # JSON shape of each card's `data` payload. Transitive via
  # genui, but we use the `S` shortcut directly in our
  # aegis_catalog.dart so the linter wants it as a direct dep.
  json_schema_builder: ^0.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  build_runner: ^2.14.0
  freezed: ^3.2.5
  json_serializable: ^6.13.1
  hive_ce_generator: ^1.11.1

flutter:
  uses-material-design: true
  assets:
    - assets/languages/
    - assets/geo/
    # Agent Skills registry. Each subdirectory is one skill; the
    # SKILL.md frontmatter is concatenated into Gemma 4's system
    # prompt as a discoverable capabilities catalog. Adding a new
    # skill = adding a new SKILL.md, no Dart code change needed.
    - assets/skills/compose-briefing/
    - assets/skills/plan-evacuation-route/
    - assets/skills/grade-damage-hazus/
    - assets/skills/intake-survivor-statement/
    - assets/skills/disaster-report-generator/
    - assets/skills/match-mesh-beacon/
