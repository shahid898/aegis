name: aegis
description: "Aegis - Offline AI emergency assistant"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5
  flutter: ^3.41.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.1
  bloc: ^9.2.0

  # Modeling
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  equatable: ^2.0.8

  # DI
  get_it: ^9.2.1

  # Routing
  go_router: ^17.2.2

  # Local storage (Hive Community Edition)
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4

  # Device / platform
  permission_handler: ^12.0.1
  geolocator: ^14.0.2
  path_provider: ^2.1.5

  # Map (region picker)
  flutter_map: ^8.3.0
  latlong2: ^0.9.1

  # i18n
  intl: ^0.20.2

  # Offline voice (STT/TTS)
  sherpa_onnx: ^1.12.39

  # Audio playback (language samples, TTS output)
  just_audio: ^0.10.5

  # Networking (one-time model-pack download)
  dio: ^5.9.2

  # Archive extraction (.tar.bz2 from sherpa-onnx releases)
  archive: ^4.0.9

  # Hashing (SHA256 verification of model packs)
  crypto: ^3.0.7

  # Microphone capture (Phase 3 assistant loop)
  flutter_sound: ^9.30.0

  # On-device LLM runtime (Phase 3 assistant brain)
  flutter_gemma: ^0.13.6

  # Telephony + clipboard for emergency SOS fallback
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  build_runner: ^2.14.0
  freezed: ^3.2.5
  json_serializable: ^6.13.1
  hive_ce_generator: ^1.11.1

flutter:
  uses-material-design: true
  assets:
    - assets/languages/
    - assets/geo/
